name: Build Portable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Staging Directory
        shell: pwsh
        run: |
          $stage = "YT-DLP-WebUI"
          New-Item -ItemType Directory -Path "$stage" -Force
          New-Item -ItemType Directory -Path "$stage/bin" -Force
          New-Item -ItemType Directory -Path "$stage/downloads" -Force
          New-Item -ItemType Directory -Path "$stage/logs" -Force

          Copy-Item "app.py" -Destination "$stage/"
          Copy-Item "start.bat" -Destination "$stage/"
          Copy-Item "stop.bat" -Destination "$stage/"
          Copy-Item "config.example.json" -Destination "$stage/config.json"
          Copy-Item "README.md" -Destination "$stage/"
          Copy-Item "LICENSE" -Destination "$stage/"
          Copy-Item "requirements.txt" -Destination "$stage/"
          Copy-Item "static" -Destination "$stage/" -Recurse
          Copy-Item "templates" -Destination "$stage/" -Recurse

      - name: Download yt-dlp & FFmpeg
        shell: pwsh
        run: |
          $stage = "YT-DLP-WebUI"
          Write-Host "Downloading yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$stage/bin/yt-dlp.exe"

          Write-Host "Downloading ffmpeg..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "*.exe" | ForEach-Object {
            Move-Item -Path $_.FullName -Destination "$stage/bin/" -Force
          }
          Remove-Item -Path "ffmpeg.zip", "ffmpeg_extracted" -Recurse -Force

      - name: Setup Embedded Python
        shell: pwsh
        run: |
          $stage = "YT-DLP-WebUI"
          $pyVer = "3.11.9"
          Write-Host "Downloading Python $pyVer embedded..."
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip" -OutFile "python-embed.zip"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "$stage/python"
          Remove-Item "python-embed.zip" -Force

          # Enable site-packages in embedded python
          $pthFile = Get-ChildItem -Path "$stage/python" -Filter "*._pth" | Select-Object -First 1
          if ($pthFile) {
            $content = Get-Content $pthFile.FullName
            $content = $content -replace '#import site', 'import site'
            Set-Content -Path $pthFile.FullName -Value $content
          }

          # Install pip into embedded python
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          & "$stage/python/python.exe" get-pip.py --no-warn-script-location
          Remove-Item "get-pip.py" -Force

          # Install dependencies
          & "$stage/python/python.exe" -m pip install flask waitress --no-warn-script-location

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $zipName = "YT-DLP-WebUI-$ver-Portable-Windows-x64.zip"
          Compress-Archive -Path "YT-DLP-WebUI" -DestinationPath "$zipName" -Force
          Write-Host "Package created: $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
